[package]
name = "ffkit"


version = "0.279.0"



edition = "2021"
rust-version = "1.80"
description = "FFmpeg hands for AI agents: probe, edit, verify"
license = "MIT"
readme = "README.md"
default-run = "ffkit"

[lib]
name = "ffkit"
path = "src/lib.rs"

[[bin]]
name = "ffkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
encoding_rs = "0.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.13"
thiserror = "2.0"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
